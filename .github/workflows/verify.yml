name: Offline Release and Regression

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '*.zip'
  pull_request:
    branches: [main, feature/v0.4-network-optics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v03:
    name: Node 24 build and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild offline executable
        run: npm run build

      - name: Legacy Engineering Golden
        run: npm run test:golden

      - name: Typed Graph Engineering Golden
        run: npm run test:p2

      - name: AI DC Game Golden
        run: npm run test:game

      - name: Chapter 2 Network Golden
        run: node tests/chapter2-golden.cjs

      - name: Experimental Typed Network Graph Golden
        run: node tests/network-golden.cjs

      - name: Chapter 2 Game-to-Graph Parity Golden
        run: node tests/chapter2-graph-golden.cjs

      - name: Release integrity
        run: node tests/release-integrity.cjs

      - name: v0.4 release integrity
        run: node tests/v04-integrity.cjs

      - name: CPO architecture and mission Golden
        run: |
          node tests/cpo-model-golden.cjs
          node tests/chapter3-golden.cjs
          node tests/campaign-golden.cjs
      - name: v0.5 source and executable integrity
        run: node tests/v05-integrity.cjs
      - name: Optical Workshop Golden and integrity
        run: |
          node tests/workshop-adapter-golden.cjs
          node tests/chapter4-golden.cjs
          node tests/workshop-storage-golden.cjs
          node tests/v06-integrity.cjs
      - name: Package v0.6 executable and rebuildable source
        run: node scripts/package-v06.cjs
      - name: Upload v0.6 executable source and handoff
        uses: actions/upload-artifact@v7
        with:
          name: ai-dc-tycoon-v06-executable-source-handoff
          path: |
            ai-dc-tycoon-v0.6.html
            ai-dc-tycoon-v0.6-source.zip
            ai-dc-tycoon-v0.6-HANDOFF.zip
            RELEASE-MANIFEST-v0.6.json
            evidence/v06/
          retention-days: 14
          if-no-files-found: error
      - name: Package v0.5 source and handoff
        run: node scripts/package-v05.cjs
      - name: Upload v0.5 executable and source archives
        uses: actions/upload-artifact@v7
        with:
          name: ai-dc-tycoon-v05-executable-source-handoff
          path: |
            ai-dc-tycoon-v0.5.html
            ai-dc-tycoon-v0.5-source.zip
            ai-dc-tycoon-v0.5-HANDOFF.zip
            RELEASE-MANIFEST-v0.5.json
            evidence/v05/
          if-no-files-found: error
          retention-days: 14
      - name: Package source and handoff
        run: node scripts/package-v04.cjs

      - name: Upload Release archives
        uses: actions/upload-artifact@v7
        with:
          name: ai-dc-tycoon-v04-source-and-handoff
          path: |
            ai-dc-tycoon-v0.4-source.zip
            ai-dc-tycoon-v0.4-HANDOFF.zip
            START-HERE-v0.4.md
          retention-days: 14
          if-no-files-found: error

      - name: Keep built HTML for review
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ai-dc-tycoon-v0.4-candidate-html
          path: |
            ai-dc-tycoon-v0.3.html
            ai-dc-tycoon-v0.4.html
          retention-days: 14
          if-no-files-found: error

# Browser assertions run in the separate bounded job below.
# Physical Android and human usability are not inferred from Chromium emulation.

  browser-v04:
    name: Offline Chapter 2 Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated browser test tools
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Build both offline releases
        run: npm run build
      - name: Execute gameplay on offline HTML
        run: node tests/chapter2-browser.cjs
        timeout-minutes: 4
      - name: Desktop, touch and bounded Backup recovery regressions
        run: node tests/v04-browser-ci.cjs
        timeout-minutes: 4
      - name: Original Engineering Browser regression
        run: node tests/browser.cjs
        timeout-minutes: 3
      - name: Original P2 Engineering Browser regression
        run: node tests/p2-browser.cjs
        timeout-minutes: 4
      - name: v0.3 Game Browser baseline assertions (stable locator)
        run: node tests/game-browser-stable-v04.cjs
        timeout-minutes: 5
      - name: Package browser screenshots
        if: always()
        run: if test -d screenshots-v04; then zip -q -r ai-dc-tycoon-v0.4-screenshots.zip screenshots-v04; fi
      - name: Archive browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-dc-tycoon-v04-browser-screenshots
          path: |
            screenshots-v04/
            ai-dc-tycoon-v0.4-screenshots.zip
            evidence/v04/
          retention-days: 14
          if-no-files-found: ignore

  browser-v05:
    name: CPO Gameplay and Protected Campaign Storage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - run: npm run build
      - name: Clear prior local browser result snapshots
        run: node -e "const fs=require('fs'); for(const n of fs.readdirSync('evidence/v05')) if(n.endsWith('browser-results.json')) fs.unlinkSync('evidence/v05/'+n)"
      - name: Desktop guided Mission07–09
        run: node tests/v05-browser.cjs
        timeout-minutes: 4
      - name: Mobile touch and Lab reference-only
        run: node tests/v05-mobile-browser.cjs
        timeout-minutes: 4
      - name: Bounded integrated Backup and Journal group
        run: node tests/v05-storage-browser.cjs
        timeout-minutes: 4
      - name: Original Mission01–06 in new v0.5 executable
        run: node tests/v05-legacy-browser.cjs
        timeout-minutes: 4
      - name: Archive genuine CPO scenes
        if: always()
        run: if test -d screenshots-v05; then zip -q -r ai-dc-tycoon-v0.5-screenshots.zip screenshots-v05; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-dc-tycoon-v05-browser-scenes-evidence
          path: |
            screenshots-v05/
            ai-dc-tycoon-v0.5-screenshots.zip
            evidence/v05/
          retention-days: 14
          if-no-files-found: ignore

  browser-v06:
    name: Optical Engine Workshop Gameplay and Protected Storage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - run: npm run build
      - name: Remove previous browser evidence
        run: node -e "const fs=require('fs');fs.mkdirSync('evidence/v06',{recursive:true});for(const n of fs.readdirSync('evidence/v06'))if(n.endsWith('browser-results.json'))fs.unlinkSync('evidence/v06/'+n)"
      - name: Desktop Mission10–12 real controls and solver parity
        run: node tests/v06-browser.cjs
        timeout-minutes: 5
      - name: Touch390/320px gameplay and challenge
        run: node tests/v06-mobile-browser.cjs
        timeout-minutes: 4
      - name: Four-head protected campaign real IndexedDB
        run: node tests/v06-storage-browser.cjs
        timeout-minutes: 5
      - name: Frozen engineering and legacy campaign in v06
        run: node tests/v06-legacy-browser.cjs
        timeout-minutes: 5
      - name: Package genuine Workshop scenes
        if: always()
        run: if test -d screenshots-v06; then zip -q -r ai-dc-tycoon-v0.6-screenshots.zip screenshots-v06; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-dc-tycoon-v06-browser-scenes-evidence
          path: |
            screenshots-v06/
            ai-dc-tycoon-v0.6-screenshots.zip
            evidence/v06/
          retention-days: 14
          if-no-files-found: ignore
