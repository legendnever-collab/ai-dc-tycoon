name: Baseline Build and Golden Regression

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '*.zip'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v03:
    name: Node 24 build and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild offline executable
        run: npm run build

      - name: Legacy Engineering Golden
        run: npm run test:golden

      - name: Typed Graph Engineering Golden
        run: npm run test:p2

      - name: AI DC Game Golden
        run: npm run test:game

      - name: Chapter 2 Network Golden
        run: node tests/chapter2-golden.cjs

      - name: Experimental Typed Network Graph Golden
        run: node tests/network-golden.cjs

      - name: Chapter 2 Game-to-Graph Parity Golden
        run: node tests/chapter2-graph-golden.cjs

      - name: Release integrity
        run: node tests/release-integrity.cjs

      - name: Package source and handoff
        run: node scripts/package-v04.cjs

      - name: Upload Release archives
        uses: actions/upload-artifact@v4
        with:
          name: ai-dc-tycoon-v04-source-and-handoff
          path: |
            ai-dc-tycoon-v0.4-source.zip
            ai-dc-tycoon-v0.4-HANDOFF.zip
            START-HERE-v0.4.md
          retention-days: 14
          if-no-files-found: error

      - name: Keep built HTML for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dc-tycoon-v0.4-candidate-html
          path: |
            ai-dc-tycoon-v0.3.html
            ai-dc-tycoon-v0.4.html
          retention-days: 14
          if-no-files-found: error

# This workflow intentionally covers build + golden tests only.
# Browser/Playwright and physical Android/corporate-PC tests remain NOT TESTED in CI.
# Do not treat this CI result as full 240-case regression without separate evidence.

  browser-v04:
    name: Offline Chapter 2 Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated browser test tools
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Build both offline releases
        run: npm run build
      - name: Execute gameplay on offline HTML
        run: node tests/chapter2-browser.cjs
        timeout-minutes: 4
      - name: Original Engineering Browser regression
        run: node tests/browser.cjs
        timeout-minutes: 3
      - name: Original P2 Engineering Browser regression
        run: node tests/p2-browser.cjs
        timeout-minutes: 4
      - name: Original v0.3 Game Browser regression
        run: node tests/game-browser.cjs
        timeout-minutes: 5
      - name: Package browser screenshots
        if: always()
        run: if test -d screenshots-v04; then zip -q -r ai-dc-tycoon-v0.4-screenshots.zip screenshots-v04; fi
      - name: Archive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dc-tycoon-v04-browser-screenshots
          path: |
            screenshots-v04/
            ai-dc-tycoon-v0.4-screenshots.zip
          retention-days: 14
          if-no-files-found: ignore
