name: v0.9 Browser Focus
on:
  push:
    branches: [feature/v0.9-free-exploration]
    paths: ['src/exploration-*.ts', 'src/exploration-style.css', 'tests/v09-browser.cjs', '.github/workflows/v09-browser-focus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v09-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v09-browser-focus-${{ github.sha }}
          path: |
            evidence/v09/browser.json
            screenshots-v09/
          if-no-files-found: error
          retention-days: 14
