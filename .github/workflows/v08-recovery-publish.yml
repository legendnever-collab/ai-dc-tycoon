name: v0.8 Recovery — Build and Publish HTML
on:
  push:
    branches:
      - feature/v0.8-assembly-yield
    paths:
      - .github/workflows/v08-recovery-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build original source without modifications
        run: |
          npm ci
          npm run build
      - name: Validate generated executable and log hash
        run: |
          test -s ai-dc-tycoon-v0.8.html
          node -e "const fs=require('fs'),c=require('crypto');const p='ai-dc-tycoon-v0.8.html',b=fs.readFileSync(p);if(b.length<100000)throw Error('Generated v08 HTML unexpectedly small');console.log(p,b.length,c.createHash('sha256').update(b).digest('hex'))"
      - name: Publish v0.8 HTML to the original feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ai-dc-tycoon-v0.8.html
          if git diff --cached --quiet; then
            echo "HTML unchanged; already committed."
          else
            git commit -m "release(v0.8): publish verified offline executable"
            git push origin HEAD:feature/v0.8-assembly-yield
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v08-recovery-built-html
          path: ai-dc-tycoon-v0.8.html
          retention-days: 14
