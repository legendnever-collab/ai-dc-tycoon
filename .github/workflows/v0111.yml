name: v0.11.1 Patch Release
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v0111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:v0111
      - name: Frozen v0.11.0 executable is byte-identical
        run: git diff --exit-code -- ai-dc-tycoon-v0.11.html
      - run: node scripts/regression-v011.cjs
      - run: npm run test:v0111
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:v0111-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0111-${{ github.sha }}
          path: |
            ai-dc-tycoon-v0.11.1.html
            evidence/v0111/
            screenshots-v0111/
          retention-days: 14
